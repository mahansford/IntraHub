name: Build and publish Docker image

# Builds a multi-arch image (amd64 + arm64, so it runs on Raspberry Pi too)
# and pushes it to Docker Hub whenever a version tag like v1.2.3 is pushed.
#
# Requires two repository secrets, set under Settings → Secrets → Actions:
#   DOCKERHUB_USERNAME — your Docker Hub username
#   DOCKERHUB_TOKEN     — a Docker Hub access token (not your password)
#
# Update DOCKERHUB_IMAGE below to your actual namespace/image before your
# first release, e.g. "janedoe/alcove".

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

env:
  DOCKERHUB_IMAGE: yourdockerhubusername/alcove

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
