<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title id="page-title">Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="ambient-glow ambient-glow-a" aria-hidden="true"></div>
  <div class="ambient-glow ambient-glow-b" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <button id="logo-box" class="logo-box" type="button" title="Logo">
          <img id="logo-img" alt="" hidden />
          <span id="logo-initials"></span>
        </button>
        <input type="file" id="logo-input" accept="image/*" hidden />
        <h1 id="site-title">IntraHub</h1>
      </div>
      <div class="topbar-right">
        <div class="clock">
          <div id="clock-time">--:--</div>
          <div id="clock-date">Loading date…</div>
        </div>
        <button id="kiosk-toggle" class="edit-toggle" type="button" title="Kiosk mode">
          <span id="kiosk-toggle-icon"></span>
        </button>
        <button id="edit-toggle" class="edit-toggle" type="button">
          <span id="edit-toggle-icon"></span>
          <span id="edit-toggle-label">Customize</span>
        </button>
      </div>
    </div>
  </header>

  <main id="dashboard" class="grid">
    <p class="muted loading-placeholder">Loading dashboard…</p>
  </main>

  <input type="file" id="background-input" accept="image/*" hidden />
  <input type="file" id="backup-restore-input" accept=".yml,.yaml,text/yaml" hidden />

  <footer class="footer">
    <p>Made with <span id="footer-heart" class="heart"></span> for our family — <span id="footer-license">AGPL-3.0</span> ·
      <a id="footer-source" href="#" target="_blank" rel="noopener">Source</a>
    </p>
  </footer>

  <!-- PIN modal -->
  <div id="pin-modal" class="modal-backdrop" hidden>
    <div class="modal">
      <h3>Enter admin PIN</h3>
      <p class="muted small">Customizing this dashboard's layout needs the admin PIN.</p>
      <form id="pin-form">
        <input id="pin-input" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off" />
        <p id="pin-error" class="error-text small" hidden>Incorrect PIN, try again.</p>
        <div class="modal-actions">
          <button type="button" id="pin-cancel" class="btn-secondary">Cancel</button>
          <button type="submit" class="btn-primary">Unlock</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Icon picker -->
  <div id="icon-picker-modal" class="modal-backdrop" hidden>
    <div class="modal icon-picker-modal">
      <h3>Choose an icon</h3>
      <div id="icon-picker-grid" class="icon-picker-grid"></div>
      <div class="modal-actions">
        <button type="button" id="icon-picker-cancel" class="btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
