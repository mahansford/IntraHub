# Copy this file to config/local.yml (gitignored) to seed your own dashboard
# on first boot instead of the generic config/default.yml. Only used once,
# when the database is empty — after that, edit live via the Customize
# button in the UI.

site:
  site_title: "Alcove"
  weather_lat: "53.0027"
  weather_lon: "-2.1794"
  weather_location_name: "Stoke-on-Trent"
  # theme: one of neon | sunset | ocean | forest
  theme: "neon"

sections:
  - type: weather
    title: Weather

  - type: stats
    title: Server Stats

  - type: todo
    title: "Today's Brief"
    items: []

  - type: links
    title: Quick Links
    links:
      - label: Questly
        icon: "map"
        url: "#"
      - label: Today
        icon: "calendar"
        url: "#"

  - type: leaderboard
    title: "Points Leaderboard"
    entries:
      - name: Kid 1
        emoji: "cat"
        points: 0
      - name: Kid 2
        emoji: "dog"
        points: 0
      - name: Kid 3
        emoji: "rabbit"
        points: 0

  - type: notes
    title: Family Notes
    notes: []

  - type: countdown
    title: Countdown
    label: "Summer Holidays"
    target_date: "2026-07-20"

  - type: stocks
    title: Stocks
    symbols: ["AAPL", "MSFT"]

  - type: chores
    title: Chores
    kids:
      - name: Kid 1
        icon: cat
        tasks: ["Make bed", "Feed the fish"]
      - name: Kid 2
        icon: dog
        tasks: ["Brush teeth", "Tidy toys"]

  # Photos and Calendar aren't seedable from YAML (binary image data /
  # a real ICS link don't belong in a text config) — add them from the
  # Customize screen after first boot.
  - type: photos
    title: Photos

  - type: calendar
    title: Calendar
